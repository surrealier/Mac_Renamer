name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Test
        run: swift test

      - name: Build Mac_Renamer.app
        run: VERSION="${TAG#v}" ./scripts/build_app.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/Mac_Renamer.zip dist/Mac_Renamer.zip.sha256 install.sh uninstall.sh"
          sed "s/__TAG__/$TAG/g" .github/release-notes.md > dist/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            gh release create "$TAG" $FILES --title "Mac_Renamer $TAG" --notes-file dist/notes.md --latest
          fi
